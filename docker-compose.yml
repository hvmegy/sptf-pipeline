services:
  init: 
    build: 
      context: ./init
      dockerfile: Dockerfile
    container_name: sptf-init 
    hostname: init 
    volumes:
      - ./init/:/home/init/
    command: > 
      bash -c  "
        pip install -r requirements.txt && \ 
        sleep infinity
      "

  postgres:
    image: postgres:17
    container_name: sptf-postgres
    hostname: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  airflow:
    image: apache/airflow
    container_name: sptf-airflow
    hostname: airflow
    
    environment:  
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://admin:admin@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      HOME: /opt/airflow/
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./airflow/:/opt/airflow/
      # ./airflow/simple_auth_manager_passwords.json.generated:/opt/airflow/simple_auth_manager_passwords.json.generated
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --email email --firstname firstname --lastname lastname --password admin --role Admin --username admin &&
        airflow standalone &&
        airflow dags trigger pipeline
      "
    ports:
      - "8080:8080"
  
  minio:
    image: minio/minio:latest
    container_name: sptf-minio
    hostname: minio
    ports:
      - "9001:9000"    # S3 API
      - "9002:9001"    # MinIO Console UI
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  spark:
    image: apache/spark:3.4.4
    container_name: sptf-spark
    hostname: spark
    environment:
      - SPARK_CONF_DIR=/opt/spark/conf
      - SPARK_MODE=master
      - HOME=/opt/spark/work-dir
    ports:
      - "4040:4040"  # UI Spark Web
    volumes:
      - ./spark/.iv2/:/home/spark/.ivy2/
      - ./spark/:/opt/spark
    command: sleep infinity

  clickhouse:
    build: 
      context: ./clickhouse/ 
      dockerfile: Dockerfile
    container_name: sptf-clickhouse
    hostname: clickhouse
    environment:
      HOME: /home/clickhouse
      CLICKHOUSE_USER: root
      CLICKHOUSE_PASSWORD: root
      CLICKHOUSE_DB: default
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse/work-dir:/home/clickhouse/
      - clickhouse-data:/var/lib/clickhouse
  
  superset: 
    build: 
      context: ./superset
    container_name: sptf-superset 
    hostname: superset 
    depends_on:
      - postgres
    ports: 
     - 8088:8088
    environment:
      SUPERSET_SECRET_KEY: admin 
      DATABASE_URL: postgresql+psycopg2://admin:admin@postgres/superset
    command: >
      /bin/sh -c "
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@superset.com --password admin &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088"

  metabase:
    image: metabase/metabase:latest
    container_name: sptf-metabase
    hostname: metabase
    volumes:
      - /dev/urandom:/dev/random:ro
    ports:
      - 3000:3000
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabaseappdb
      MB_DB_PORT: 5432
      MB_DB_USER: admin
      MB_DB_PASS: admin
      MB_DB_HOST: postgres

volumes:
  clickhouse-data:
  pg_data:
  minio_data:
  grafana-data:
